version: '2.1'
services:
  web:
    build: 
      context: ./
      dockerfile: Dockerfile.dev
    # extra_hosts:
    #   - "database.lib.wvu.edu:172.17.0.1"
    #   - "www.libraries.wvu.edu:127.0.0.1"
    container_name: web
    volumes:   
      - ./config:/config    
      - ./data/session:/var/lib/php/session         
      - ./data/logs:/tmp/log 
      - ./public_html:/home/mfcs.lib.wvu.edu/public_html         
      - ./serverConfiguration:/home/mfcs.lib.wvu.edu/serverConfiguration  
      - ./SQLFiles:/home/mfcs.lib.wvu.edu/SQLFiles    
      - ./data/git:/tmp/git
      # paths for mfcs exports
      - ./data/git/mfcs-export:/home/mfcs.lib.wvu.edu/git_pull/mfcs-export
      - ./mfcs-manual-imports:/home/mfcs.lib.wvu.edu/mfcs-manual-imports
      # map in the engineAPI template directory
      - ./template:/tmp/git/engineAPI/engine/template/
      # set specific config files
      - ./config/config.ini:/home/mfcs.lib.wvu.edu/config.ini 
      - ./config/php.ini:/usr/local/etc/php/php.ini 
      - ./config/api_acl.php:/home/mfcs.lib.wvu.edu/api_acl.php
      # mapped volumes
      - ./data/mfcs-data/archives:/home/mfcs.lib.wvu.edu/data/archives
      # folder contains processed files - needed for generating exports
      - ./data/mfcs-data/processed:/home/mfcs.lib.wvu.edu/data/exports
      # working directory - uploads, tmp, mfcsStaging
      - ./data/mfcs-data/working:/home/mfcs.lib.wvu.edu/data/working
      # folder contains the main index.php and subdirectories linking back to the
      # mfcs-exports git repo. See the mfcs-exports git repo for more information.
      # only mount if you testing exports. rename the exiting folder prior to mounting
      - ./data/exports-store:/home/mfcs.lib.wvu.edu/exports
      # replace with nsf share - needed for exports / imports to hydra heads
      - ./data/mfcs-data/nfs-exports:/home/mfcs.lib.wvu.edu/data/nfs-exports
      # map in testing folder
      - ./data/mfcs-data/testing:/home/mfcs.lib.wvu.edu/data/testing
    env_file:
        - './env/.env.dev.mfcs' 
    ports:
      - "8080:80"
    depends_on:
      db:
          condition: service_healthy   
    healthcheck:
      test: curl --fail -s http://localhost/ || exit 1
      interval: 1m30s
      timeout: 10s
      retries: 3      
  db:
    image: mysql:8
    container_name: db
    restart: on-failure
    ports:
      - "3306:3306"
    ulimits:
        nofile: # Fix memory leak issue on some systems when LimitCORE=infinity (containerd)
          soft: 1048576
          hard: 1048576      
    env_file:
      - './env/.env.dev.db'         
    volumes:
      - ./config/mysql.cnf:/etc/mysql/conf.d/mysql.cnf
      - mysql:/var/lib/mysql
      - ./SQLFiles/setup-docker.sql:/docker-entrypoint-initdb.d/setup-docker.sql
    healthcheck:
        test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
        timeout: 30s
        retries: 10

volumes:
  mysql: